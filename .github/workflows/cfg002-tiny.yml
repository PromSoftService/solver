name: CFG002 tiny report

on:
  push:
    branches: [main]
    paths:
      - 'tools/report_cfg002_pairdraw_overcards.py'
      - '.github/workflows/cfg002-tiny.yml'
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print pair-draw and overcard report
        run: python3 tools/report_cfg002_pairdraw_overcards.py
