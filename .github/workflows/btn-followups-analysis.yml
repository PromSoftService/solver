name: BTN follow-up analysis

on:
  push:
    branches: [main]
    paths:
      - 'tools/analyze_rng002_btn_followups.py'
      - 'tools/analyze_rng002_btn_refine.py'
      - 'tools/analyze_rng002_btn_followups_refine.py'
      - 'tools/evaluate_btn_final_candidates.py'
      - 'tools/evaluate_btn_noraise_3class.py'
      - 'datasets/DS__RNG002__CFG003__NOD004__BRD001__RUN-*.csv'
      - 'datasets/DS__RNG002__CFG003__NOD005__BRD001__RUN-*.csv'
      - '.github/workflows/btn-followups-analysis.yml'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyze BTN follow-up studies
        run: python3 tools/analyze_rng002_btn_followups.py
      - name: Refine human simplifications
        run: python3 tools/analyze_rng002_btn_refine.py
      - name: Analyze familiar six-class simplifications
        run: python3 tools/analyze_rng002_btn_followups_refine.py
      - name: Evaluate final candidates
        run: python3 tools/evaluate_btn_final_candidates.py
      - name: Evaluate 3-class no-raise BTN defense
        run: python3 tools/evaluate_btn_noraise_3class.py
