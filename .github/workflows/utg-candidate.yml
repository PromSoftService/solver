name: UTG candidate report
on:
  push:
    branches: [main]
    paths:
      - 'tools/report_utg_candidate.py'
      - '.github/workflows/utg-candidate.yml'
  workflow_dispatch:
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/report_utg_candidate.py
