name: Full-tree runner static check
on:
  push:
    branches: [main]
    paths:
      - 'tsgpu-*.ps1'
      - 'tsgpu-*.cmd'
      - 'scripts/**'
      - 'studies/**'
      - 'AGENTS.md'
      - 'README.md'
      - 'docs/**'
      - '.github/workflows/runner-fulltree-check.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse production PowerShell
        shell: pwsh
        run: |
          $files = @(
            'tsgpu-worker.ps1',
            'tsgpu-batch.ps1',
            'scripts/Range-Utils.ps1',
            'scripts/Run-STU001.ps1',
            'scripts/Run-STU002.ps1'
          )
          foreach ($f in $files) {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f),[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count) {
              Write-Host "PARSER ERRORS IN $f"
              $errors | ForEach-Object { Write-Host ("line {0}: {1} :: {2}" -f $_.Extent.StartLineNumber,$_.ErrorId,$_.Message) }
              exit 1
            }
          }

      - name: Validate active STU002 exact legacy CFG001 tree and full-tree contract
        shell: pwsh
        run: |
          $s = Get-Content studies/STU002__UTG-BB__LEGACY-CFG001-SIZES__FULLTREE__V1.json -Raw | ConvertFrom-Json
          if ($s.study_id -ne 'STU002') { throw 'wrong active study id' }
          if ($s.tree.flop.oop_bet -ne '') { throw 'oopFlopBet must remain empty' }
          if ($s.tree.flop.ip_bet -ne '33') { throw 'ipFlopBet must remain 33' }
          if ($s.tree.flop.oop_raise -ne '60') { throw 'oopFlopRaise must remain 60' }
          if ($s.tree.flop.ip_raise -ne '100') { throw 'ipFlopRaise must remain 100' }
          foreach ($name in @('oop_bet','ip_bet','oop_donk','oop_raise','ip_raise')) {
            if ([string]$s.tree.turn.$name -ne '100') { throw "turn $name must remain 100" }
            if ([string]$s.tree.river.$name -ne '100') { throw "river $name must remain 100" }
          }
          if ([int]$s.tree.max_raise_number -ne 3) { throw 'maxRaiseNumber must remain 3' }
          if ([int]$s.tree.add_allin_threshold_percent -ne 200) { throw 'addAllinThreshold must remain 200 study value' }
          foreach ($flag in @('add_allin_flop_ip','add_allin_turn_ip','add_allin_river_ip','add_allin_flop_oop','add_allin_turn_oop','add_allin_river_oop')) {
            if (-not [bool]$s.tree.$flag) { throw "$flag must remain enabled" }
          }
          $boards = @(Get-Content $s.board_file | Where-Object { $_.Trim() })
          if ($boards.Count -ne 286) { throw "BRD001 expected 286 boards; got $($boards.Count)" }

          $workerText = Get-Content tsgpu-worker.ps1 -Raw
          $batchText = Get-Content tsgpu-batch.ps1 -Raw
          $launcherText = Get-Content scripts/Run-STU002.ps1 -Raw
          if ($workerText -notmatch 'FULL_TREE_EXPORT_UNRESOLVED') { throw 'worker full-tree guard missing' }
          if ($workerText -notmatch 'Test-FullTreeJson') { throw 'worker full-tree structural validation missing' }
          if ($batchText -notmatch 'Stopping immediately instead of wasting the remaining GPU solves') { throw 'batch fail-fast guard missing' }
          if ($launcherText -notmatch "git push origin HEAD:main") { throw 'STU002 auto-push missing' }
          if ($launcherText -notmatch "results/\$runName") { throw 'STU002 result promotion missing' }

          if (Test-Path datasets) { throw 'legacy datasets directory must stay absent' }
          $analysisFiles = @(Get-ChildItem analysis -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -ne '.gitkeep' })
          if ($analysisFiles.Count) { throw 'analysis must remain empty before new results' }
          Write-Host 'PASS: STU002 exactly matches historical CFG001 tree settings and requires full-tree export + auto-push.'
