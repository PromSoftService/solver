name: Full-tree runner static check
on:
  push:
    branches: [main]
    paths:
      - 'tsgpu-*.ps1'
      - 'tsgpu-*.cmd'
      - 'scripts/**'
      - 'studies/**'
      - 'AGENTS.md'
      - 'README.md'
      - 'docs/**'
      - '.github/workflows/runner-fulltree-check.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse production PowerShell
        shell: pwsh
        run: |
          $files = @('tsgpu-worker.ps1','tsgpu-batch.ps1','scripts/Range-Utils.ps1','scripts/Run-STU001.ps1')
          foreach ($f in $files) {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f),[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count) {
              Write-Host "PARSER ERRORS IN $f"
              $errors | ForEach-Object { Write-Host ("line {0}: {1} :: {2}" -f $_.Extent.StartLineNumber,$_.ErrorId,$_.Message) }
              exit 1
            }
          }
      - name: Validate STU001 and clean generation
        shell: pwsh
        run: |
          $s = Get-Content studies/STU001__UTG-BB__FULLTREE__V1.json -Raw | ConvertFrom-Json
          if ($s.tree.flop.bet -ne '33,75') { throw 'flop sizes changed' }
          if ($s.tree.turn.bet -ne '33,75') { throw 'turn sizes changed' }
          if ($s.tree.river.bet -ne '33,75,150') { throw 'river sizes changed' }
          if ($s.tree.flop.raise -ne '60' -or $s.tree.max_normal_raises -ne 1) { throw 'raise abstraction changed' }
          if ([int]$s.tree.add_allin_threshold_percent -lt 1800) { throw 'all-in threshold no longer covers initial flop SPR' }
          $boards = @(Get-Content $s.board_file | Where-Object { $_.Trim() })
          if ($boards.Count -ne 286) { throw "BRD001 expected 286 boards; got $($boards.Count)" }
          if (Test-Path datasets) { throw 'legacy datasets directory must stay absent' }
          $analysisFiles = @(Get-ChildItem analysis -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -ne '.gitkeep' })
          if ($analysisFiles.Count) { throw 'analysis must start empty after reset' }
          if (Test-Path '.github/workflows/repair-runner-syntax-once.yml') { throw 'temporary repair workflow must be absent' }
          if (Test-Path '.github/workflows/build-fulltree-runner-once.yml') { throw 'temporary build workflow must be absent' }
          $workerText = Get-Content tsgpu-worker.ps1 -Raw
          $batchText = Get-Content tsgpu-batch.ps1 -Raw
          if ($workerText -notmatch 'FULL_TREE_EXPORT_UNRESOLVED') { throw 'worker full-tree guard missing' }
          if ($batchText -notmatch 'Stopping immediately instead of wasting the remaining GPU solves') { throw 'batch fail-fast guard missing' }
          Write-Host 'PASS: clean full-tree generation; STU001 and fatal-export guards are intact.'
