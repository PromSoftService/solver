name: Apply NOD006 patch

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply_nod006_patch.py'
      - '.github/workflows/apply-nod006-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply NOD006 changes
        run: python3 tools/apply_nod006_patch.py
      - name: Parse changed PowerShell
        shell: pwsh
        run: |
          $failed = $false
          foreach ($path in @(
            'tsgpu-worker.ps1',
            'tsgpu-batch.ps1',
            'scripts/Run-Study.ps1',
            'scripts/Run-CFG003-NOD006-BRD001.ps1',
            'tools/collect_dataset.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              Write-Host "Parser errors in $path"
              $errors | ForEach-Object { Write-Host $_.Message }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
      - name: Smoke checks
        shell: bash
        run: |
          grep -q "UTG_RESPONSE" tsgpu-worker.ps1
          grep -q "utg_response_raise" configs/CFG003__6M100_UTG-O2p5_BTN-C__F_OOP-B33-XR60_IP-B33-R100__T-B100-R100__R-B100-R100__V1.derived.json
          test -f scripts/Run-CFG003-NOD006-BRD001.ps1
          test -f scripts/RUN__CFG003__NOD006__BRD001__AND_PUSH.cmd
          test -f .github/workflows/runner-v015-utg-response-check.yml
          git diff --check
      - name: Commit NOD006
        run: |
          git config user.name "PromSoftService"
          git config user.email "97607535+PromSoftService@users.noreply.github.com"
          git add AGENTS.md README.md docs/STUDY_REGISTRY.md configs tsgpu-worker.ps1 tsgpu-batch.ps1 scripts tools/collect_dataset.ps1 .github/workflows/runner-v015-utg-response-check.yml
          git commit -m "add UTG defense versus BTN stab study"
          git push
