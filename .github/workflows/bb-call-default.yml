name: BB call-default report

on:
  push:
    branches: [main]
    paths:
      - 'tools/report_bb_call_default.py'
      - '.github/workflows/bb-call-default.yml'
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/report_bb_call_default.py
