name: Runner current-street check
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell baseline
        shell: pwsh
        run: |
          $files = @(
            'tsgpu-worker.ps1',
            'tsgpu-batch.ps1',
            'scripts/Range-Utils.ps1',
            'studies/STU001__RNG001_UTG-vs-BB__5FLOP_50-50/run.ps1',
            'studies/STU002__RNG001_UTG-vs-BB__BRD001_FLOP6/run-branch.ps1',
            'studies/STU002__RNG001_UTG-vs-BB__BRD001_FLOP6/run-all.ps1',
            'scripts/run-flop-study-branch.ps1',
            'scripts/run-flop-study-all.ps1',
            'studies/STU004__RNG002_UTG-vs-BTN__BRD001_FLOP4/run-branch.ps1',
            'studies/STU004__RNG002_UTG-vs-BTN__BRD001_FLOP4/run-all.ps1'
          )
          foreach ($f in $files) {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f),[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count) {
              Write-Host "PARSER ERRORS IN $f"
              $errors | ForEach-Object { Write-Host ("line {0}: {1} :: {2}" -f $_.Extent.StartLineNumber,$_.ErrorId,$_.Message) }
              exit 1
            }
          }
      - name: Validate clean baseline
        shell: pwsh
        run: |
          foreach ($forbidden in @('analysis','results','configs','tools')) {
            if (Test-Path $forbidden) { throw "Forbidden result/study directory present: $forbidden" }
          }
          $worker = Get-Content tsgpu-worker.ps1 -Raw
          if ($worker -notmatch "v015-production") { throw 'Worker is not the proven v015 baseline' }
          foreach ($bad in @('solver.export.fullTree','solver.export.allStreets','solver.export.fullStrategy','solver.dump.strategy','FULL_TREE_EXPORT_UNRESOLVED','Test-FullTreeJson')) {
            if ($worker.Contains($bad)) { throw "Experimental full-tree probe leaked into baseline: $bad" }
          }
          $ranges = @(Get-ChildItem ranges -File)
          if ($ranges.Count -ne 6) { throw "Expected 6 source range files; got $($ranges.Count)" }
          $boards = @(Get-Content boards/BRD001__FLOP_UNPAIRED_RAINBOW__ISO286__V1.txt | Where-Object { $_.Trim() })
          if ($boards.Count -ne 286) { throw "Expected 286 BRD001 boards; got $($boards.Count)" }
          if (-not (Test-Path smoke/CFG001-one-board.json) -or -not (Test-Path smoke/boards.txt)) { throw 'Smoke fixture missing' }
          $smokeBoards = @(Get-Content smoke/boards.txt | Where-Object { $_.Trim() -and -not $_.Trim().StartsWith('#') })
          if ($smokeBoards.Count -ne 1) { throw "Expected one smoke board; got $($smokeBoards.Count)" }
          $example = Get-Content example/config.json -Raw | ConvertFrom-Json
          $exampleBoards = @(Get-Content example/boards.txt | Where-Object { $_.Trim() -and -not $_.Trim().StartsWith('#') })
          if ($exampleBoards.Count -ne 5) { throw "Expected five example boards; got $($exampleBoards.Count)" }
          if ($example.runner.decisionNode -ne 'BB_RESPONSE' -or [int]$example.runner.expectedBetAmount -ne 18 -or [int]$example.runner.expectedRaiseAmount -ne 73) { throw 'Example runner branch settings changed' }
          $batch = Get-Content tsgpu-batch.ps1 -Raw
          foreach ($setting in @('decisionNode','expectedBetAmount','expectedRaiseAmount')) {
            if (-not $batch.Contains($setting)) { throw "Config-driven setting missing: $setting" }
          }
          $studyPath = 'studies/STU001__RNG001_UTG-vs-BB__5FLOP_50-50'
          $study = Get-Content "$studyPath/study.json" -Raw | ConvertFrom-Json
          $studyConfig = Get-Content "$studyPath/config.json" -Raw | ConvertFrom-Json
          $studyBoards = @(Get-Content "$studyPath/boards.txt" | Where-Object { $_.Trim() -and -not $_.Trim().StartsWith('#') })
          if ($study.study_id -ne 'STU001' -or $studyBoards.Count -ne 5) { throw 'STU001 manifest/boards invalid' }
          if ($studyConfig.runner.decisionNode -ne 'BB_RESPONSE' -or [int]$studyConfig.runner.expectedBetAmount -ne 28 -or [int]$studyConfig.runner.expectedRaiseAmount -ne 95) { throw 'STU001 runner guards invalid' }
          if ($studyConfig.config.ipFlopBet -ne '50' -or $studyConfig.config.ipTurnBet -ne '50' -or $studyConfig.config.ipRiverBet -ne '100') { throw 'STU001 IP sizing invalid' }
          if ($studyConfig.config.oopFlopBet -ne '50' -or $studyConfig.config.oopTurnDonk -ne '50' -or $studyConfig.config.oopRiverDonk -ne '75') { throw 'STU001 OOP sizing invalid' }
          if ([int]$studyConfig.config.maxRaiseNumber -ne 2) { throw 'STU001 maxRaiseNumber invalid' }
          $study2Path = 'studies/STU002__RNG001_UTG-vs-BB__BRD001_FLOP6'
          $study2 = Get-Content "$study2Path/study.json" -Raw | ConvertFrom-Json
          $study2Config = Get-Content "$study2Path/config.json" -Raw | ConvertFrom-Json
          $expectedBranches = @('BB_FIRST','UTG_CBET','BB_RESPONSE','UTG_VS_CHECK_RAISE','UTG_VS_DONK','BB_VS_DONK_RAISE')
          $actualBranches = @($study2.branches | ForEach-Object { $_.decision_node })
          if ($study2.study_id -ne 'STU002' -or $actualBranches.Count -ne 6) { throw 'STU002 manifest invalid' }
          if (@($actualBranches | Select-Object -Unique).Count -ne 6) { throw 'STU002 decision nodes are not unique' }
          foreach ($decision in $expectedBranches) {
            if ($actualBranches -notcontains $decision) { throw "STU002 is missing $decision" }
            if (-not $worker.Contains("'$decision'")) { throw "Worker is missing STU002 preset $decision" }
            if (-not $batch.Contains("'$decision'")) { throw "Batch is missing STU002 preset $decision" }
          }
          if ($study2Config.runner.decisionNode -ne 'BB_FIRST' -or [int]$study2Config.runner.expectedBetAmount -ne 28 -or [int]$study2Config.runner.expectedRaiseAmount -ne 95) { throw 'STU002 runner guards invalid' }
          if ($study2Config.config.ipFlopBet -ne '50' -or $study2Config.config.oopFlopBet -ne '50' -or [int]$study2Config.config.maxRaiseNumber -ne 2) { throw 'STU002 flop abstraction invalid' }
          if (@($study2Config.config.ipRange).Count -ne 1326 -or @($study2Config.config.oopRange).Count -ne 1326) { throw 'STU002 range lengths invalid' }
          if ((ConvertTo-Json @($study2Config.config.ipRange) -Compress) -ne (ConvertTo-Json @($studyConfig.config.ipRange) -Compress)) { throw 'STU002 IP range differs from proven RNG001 input' }
          if ((ConvertTo-Json @($study2Config.config.oopRange) -Compress) -ne (ConvertTo-Json @($studyConfig.config.oopRange) -Compress)) { throw 'STU002 OOP range differs from proven RNG001 input' }
          . ./scripts/Range-Utils.ps1
          $expectedBtn = @(Convert-TexasSolverRangeTo1326 -Path 'ranges/RNG002__TSGPU020_6M100_UTG-O2p5_BTN-C__V1__BTN.txt')
          $expectedUtg = @(Convert-TexasSolverRangeTo1326 -Path 'ranges/RNG002__TSGPU020_6M100_UTG-O2p5_BTN-C__V1__UTG.txt')
          $study4Path = 'studies/STU004__RNG002_UTG-vs-BTN__BRD001_FLOP4'
          $study4 = Get-Content "$study4Path/study.json" -Raw | ConvertFrom-Json
          $study4Config = Get-Content "$study4Path/config.json" -Raw | ConvertFrom-Json
          $study4Boards = @(Get-Content $study4.board_file | Where-Object { $_.Trim() -and -not $_.Trim().StartsWith('#') })
          $actualStudy4Branches = @($study4.branches | ForEach-Object { $_.decision_node })
          $expectedStudy4Branches = @('UTG_OOP_CBET','BTN_STAB','BTN_RESPONSE','UTG_RESPONSE')
          if ($study4.study_id -ne 'STU004' -or $study4Boards.Count -ne 286 -or [int]$study4.expected_boards -ne 286 -or $actualStudy4Branches.Count -ne 4) { throw 'STU004 manifest/boards invalid' }
          foreach ($decision in $expectedStudy4Branches) {
            if ($actualStudy4Branches -notcontains $decision) { throw "STU004 is missing $decision" }
            if (-not $worker.Contains("'$decision'")) { throw "Worker is missing STU004 preset $decision" }
            if (-not $batch.Contains("'$decision'")) { throw "Batch is missing STU004 preset $decision" }
          }
          if ([int]$study4Config.config.startingPot -ne 65 -or [int]$study4Config.config.effectiveStack -ne 975) { throw 'STU004 pot/stack invalid' }
          if ($study4Config.config.ipFlopBet -ne '50' -or $study4Config.config.oopFlopBet -ne '50' -or [int]$study4Config.config.maxRaiseNumber -ne 2) { throw 'STU004 flop abstraction invalid' }
          if (@($study4Config.config.ipRange).Count -ne 1326 -or @($study4Config.config.oopRange).Count -ne 1326) { throw 'STU004 range lengths invalid' }
          for ($i = 0; $i -lt 1326; $i++) {
            if ([Math]::Abs([double]$study4Config.config.ipRange[$i] - [double]$expectedBtn[$i]) -gt 1e-12) { throw "STU004 IP range differs from RNG002 BTN source at combo $i" }
            if ([Math]::Abs([double]$study4Config.config.oopRange[$i] - [double]$expectedUtg[$i]) -gt 1e-12) { throw "STU004 OOP range differs from RNG002 UTG source at combo $i" }
          }
          if (-not (Test-Path datasets/README.md)) { throw 'Tracked dataset policy is missing' }
          foreach ($studyId in @('STU002__RNG001_UTG-vs-BB__BRD001_FLOP6','STU004__RNG002_UTG-vs-BTN__BRD001_FLOP4')) {
            $strategyRoot = "datasets/$studyId/analysis"
            $shortId = $studyId.Split('__')[0]
            foreach ($required in @(
              "$strategyRoot/${shortId}_simplified_flop_strategy.xlsx",
              "$strategyRoot/${shortId}_strategy_8_categories.xlsx",
              "$strategyRoot/strategy-13/manifest.json",
              "$strategyRoot/strategy-8/manifest.json"
            )) {
              if (-not (Test-Path $required -PathType Leaf)) { throw "Missing strategy standard file: $required" }
            }
            foreach ($obsolete in @('clustered-13-smooth-v2','layered-smooth-12')) {
              if (Test-Path "$strategyRoot/$obsolete") { throw "Rejected smoothing output is active: $obsolete" }
            }
          }
          foreach ($required in @('docs/FLOP_STRATEGY_WORKFLOW.md','scripts/flop_strategy.py','scripts/generate-flop-strategies.py','scripts/build-flop-workbooks.mjs')) {
            if (-not (Test-Path $required -PathType Leaf)) { throw "Missing generic strategy file: $required" }
          }
          Write-Host 'PASS: proven v015 selected current-street production runner.'
      - name: Rebuild and validate strategy data
        shell: pwsh
        run: |
          python -m py_compile scripts/flop_strategy.py scripts/generate-flop-strategies.py
          node --check scripts/build-flop-workbooks.mjs
          node --check scripts/generate-stu004-config.mjs
          node scripts/generate-stu004-config.mjs
          git diff --exit-code -- studies/STU004__RNG002_UTG-vs-BTN__BRD001_FLOP4/config.json
          python scripts/generate-flop-strategies.py STU002__RNG001_UTG-vs-BB__BRD001_FLOP6
          python scripts/generate-flop-strategies.py STU004__RNG002_UTG-vs-BTN__BRD001_FLOP4 --run run-20260909-221703Z
          git diff --exit-code -- datasets/STU002__RNG001_UTG-vs-BB__BRD001_FLOP6/analysis datasets/STU004__RNG002_UTG-vs-BTN__BRD001_FLOP4/analysis
