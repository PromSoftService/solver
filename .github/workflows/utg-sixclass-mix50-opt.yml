name: UTG six-class MIX50 optimization
on:
  push:
    paths:
      - 'tools/report_utg_sixclass_mix50_opt.py'
      - '.github/workflows/utg-sixclass-mix50-opt.yml'
      - 'datasets/DS__RNG001__CFG001__NOD002__BRD001__RUN-*.csv'
  workflow_dispatch:
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/report_utg_sixclass_mix50_opt.py
