name: CFG001 2OC fold check

on:
  push:
    branches: [main]
    paths:
      - 'tools/report_cfg001_2oc_fold.py'
      - '.github/workflows/cfg001-2oc-fold.yml'
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print CFG001 2OC fold report
        run: python3 tools/report_cfg001_2oc_fold.py
