name: Apply BTN follow-up study patch

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply_btn_study_patch.py'
      - '.github/workflows/apply-btn-study-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 tools/apply_btn_study_patch.py
      - name: Parse changed PowerShell
        shell: pwsh
        run: |
          $failed = $false
          foreach ($path in @(
            'tsgpu-worker.ps1',
            'tsgpu-batch.ps1',
            'scripts/Run-Study.ps1',
            'scripts/Run-CFG003-NOD004-BRD001.ps1',
            'scripts/Run-CFG003-NOD005-BRD001.ps1',
            'tools/collect_dataset.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              Write-Host "Parser errors in $path"
              $errors | ForEach-Object { Write-Host $_.Message }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
      - name: Check diff
        run: git diff --check
      - name: Commit patch
        run: |
          git config user.name "PromSoftService"
          git config user.email "97607535+PromSoftService@users.noreply.github.com"
          git add .
          git commit -m "add BTN flop follow-up studies"
          git push
