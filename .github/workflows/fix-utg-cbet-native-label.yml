name: Fix UTG cbet native label

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-utg-cbet-native-label.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch worker
        run: python3 tools/patch_utg_cbet_native_label.py
      - name: Commit fix
        run: |
          git config user.name "PromSoftService"
          git config user.email "97607535+PromSoftService@users.noreply.github.com"
          git add tsgpu-worker.ps1
          git commit -m "accept native Raise label for UTG cbet"
          git push
