name: UTG old13 reanalysis
on:
  push:
    paths:
      - 'tools/report_utg_old13_reanalysis.py'
      - '.github/workflows/utg-old13-reanalysis.yml'
      - 'datasets/DS__RNG001__CFG001__NOD002__BRD001__RUN-*.csv'
  workflow_dispatch:
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/report_utg_old13_reanalysis.py
