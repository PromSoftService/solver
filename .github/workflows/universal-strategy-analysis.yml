name: Universal strategy analysis

on:
  push:
    branches: [main]
    paths:
      - 'tools/universal_strategy/**'
      - 'datasets/**'
      - '.github/workflows/universal-strategy-analysis.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: universal-strategy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned analysis dependencies
        run: |
          python3 -m venv .analysis-venv
          .analysis-venv/bin/pip install numpy==2.3.5 scipy==1.17.0
          echo "$GITHUB_WORKSPACE/.analysis-venv/bin" >> "$GITHUB_PATH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Validate Python sources
        run: python3 -m py_compile tools/universal_strategy/core.py tools/universal_strategy/optimize.py tools/universal_strategy/experiments.py
      - name: EXP-002 bounded architecture comparison
        run: python3 tools/universal_strategy/experiments.py --stage architectures
      - name: Persist verified EXP-002 checkpoint
        run: |
          git add analysis/universal_strategy/experiments/ analysis/universal_strategy/PROGRESS.md
          if ! git diff --cached --quiet; then
            git commit -m 'universal strategy: persist verified EXP-002 architecture comparison'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: EXP-003 fixed-grid action candidates
        run: python3 tools/universal_strategy/experiments.py --stage candidates
      - name: Persist verified EXP-003 checkpoint
        run: |
          git add analysis/universal_strategy/experiments/ analysis/universal_strategy/PROGRESS.md
          if ! git diff --cached --quiet; then
            git commit -m 'universal strategy: persist verified EXP-003 fixed-grid candidates'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Preserve reports including partial results on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universal-strategy-analysis
          retention-days: 14
          path: analysis/universal_strategy/
