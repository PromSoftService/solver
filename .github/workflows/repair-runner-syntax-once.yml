name: Repair runner syntax once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-runner-syntax-once.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair compact foreach tokens and validate
        shell: pwsh
        run: |
          $patches = @{
            'tsgpu-worker.ps1' = @(@('foreach($c in$candidates)','foreach ($c in $candidates)'))
            'tsgpu-batch.ps1' = @(@("foreach(`$container in@('runner','solve'))","foreach (`$container in @('runner','solve'))"))
            'scripts/Run-STU001.ps1' = @(@('foreach($row in$summary)','foreach ($row in $summary)'))
          }
          foreach ($file in $patches.Keys) {
            $text = Get-Content $file -Raw
            foreach ($pair in $patches[$file]) { $text = $text.Replace($pair[0],$pair[1]) }
            Set-Content $file -Value $text -Encoding utf8NoBOM
          }
          $files = @('tsgpu-worker.ps1','tsgpu-batch.ps1','scripts/Range-Utils.ps1','scripts/Run-STU001.ps1')
          foreach ($f in $files) {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f),[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count) {
              Write-Host "PARSER ERRORS IN $f"
              $errors | ForEach-Object { Write-Host ("line {0}: {1} :: {2}" -f $_.Extent.StartLineNumber,$_.ErrorId,$_.Message) }
              exit 1
            }
          }
      - name: Commit repaired sources
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tsgpu-worker.ps1 tsgpu-batch.ps1 scripts/Run-STU001.ps1
          git commit -m 'fix full-tree runner PowerShell syntax'
          git pull --rebase origin main
          git push origin HEAD:main
