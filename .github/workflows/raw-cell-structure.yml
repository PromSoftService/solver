name: EXP-004 raw cell structure

on:
  push:
    branches: [main]
    paths:
      - 'tools/raw_cell_structure.py'
      - '.github/workflows/raw-cell-structure.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: raw-cell-structure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install existing pinned NumPy dependency
        run: |
          python3 -m venv .raw-profile-venv
          .raw-profile-venv/bin/pip install numpy==2.3.5
          echo "$GITHUB_WORKSPACE/.raw-profile-venv/bin" >> "$GITHUB_PATH"
      - name: Validate source syntax
        run: python3 -m py_compile tools/raw_cell_structure.py
      - name: Generate EXP-004 only - no optimization and no old experiment reruns
        run: python3 -u tools/raw_cell_structure.py
      - name: Check protected inputs and Markdown table syntax
        run: |
          git diff --exit-code -- datasets/ configs/ ranges/ boards/ tools/universal_strategy/ analysis/universal_strategy/experiments/EXP-001.json analysis/universal_strategy/experiments/EXP-001.md analysis/universal_strategy/experiments/EXP-002.json analysis/universal_strategy/experiments/EXP-002.md analysis/universal_strategy/experiments/EXP-003.json analysis/universal_strategy/experiments/EXP-003.md
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          root=Path('analysis/universal_strategy/experiments')
          report=json.loads((root/'EXP-004.json').read_text())
          assert len(report['studies'])==7
          assert sum(len(v) for s in report['studies'].values() for v in s['cells'].values())==1365
          for name in ('EXP-004.md','EXP-004-matrices.md'):
              lines=(root/name).read_text().splitlines()
              for i,line in enumerate(lines):
                  if line.startswith('| Рука |'):
                      parts=lines[i+1].strip('|').split('|')
                      assert len(parts)==15
                      assert all(re.fullmatch(r':?-{3,}:?',p.strip()) for p in parts), lines[i+1]
          print('PASS: seven independent profiles; 1365 cells; Markdown tables valid; protected files unchanged.')
          PY
      - name: Record completed raw-profile checkpoint
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('analysis/universal_strategy')
          r=json.loads((root/'experiments/EXP-004.json').read_text())
          p=root/'PROGRESS.md'
          text=p.read_text()
          before=text.split('\n## Next step\n')[0]
          section='\n## EXP-004 completion\n'
          if section in before:
              before=before.split(section)[0]
          before+=section
          before+=f"Raw profiles generated by tools/raw_cell_structure.py. GHA {r['run_id']}; input code {r['input_commit']}. Seven studies, 13 classes, 15 rows, 1365 cells. No human actions, merges, policy search, equity or reruns of EXP-001/002/003. Protected-file diff and table validation passed.\n"
          before+='Outputs: experiments/EXP-004.json (full profiles and descriptive neighboring-column distances), EXP-004.md (frequencies/reach/forced losses), EXP-004-matrices.md (compact seven matrices), EXP-004-cells.csv, EXP-004/ (per-study JSON). Zero-reach and absent cells distinguished.\n'
          before+='\n## Next step\nRead the generated EXP-004 matrices and neighboring-column diagnostics; record natural profile regions and tentative merge proposals without selecting human actions or merging classes. Report the evidence and STOP. A new user message is required for the next computational stage.\n'
          p.write_text(before)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/universal_strategy/experiments/EXP-004/ analysis/universal_strategy/experiments/EXP-004.json analysis/universal_strategy/experiments/EXP-004.md analysis/universal_strategy/experiments/EXP-004-matrices.md analysis/universal_strategy/experiments/EXP-004-cells.csv analysis/universal_strategy/PROGRESS.md
          if ! git diff --cached --quiet; then
            git commit -m 'universal strategy: persist EXP-004 independent raw cell profiles'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Preserve full or partial raw profiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EXP-004-raw-cell-structure
          retention-days: 30
          path: |
            analysis/universal_strategy/experiments/EXP-004*
            analysis/universal_strategy/PROGRESS.md
            tools/raw_cell_structure.py
            tools/universal_strategy/core.py
