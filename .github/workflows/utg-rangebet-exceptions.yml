name: UTG range-bet exception report

on:
  push:
    branches: [main]
    paths:
      - 'tools/report_utg_rangebet_exceptions.py'
      - '.github/workflows/utg-rangebet-exceptions.yml'
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/report_utg_rangebet_exceptions.py
