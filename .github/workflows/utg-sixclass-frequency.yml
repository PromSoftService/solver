name: UTG six-class frequency
on:
  push:
    paths:
      - 'tools/report_utg_sixclass_frequency.py'
      - '.github/workflows/utg-sixclass-frequency.yml'
      - 'datasets/DS__RNG001__CFG001__NOD002__BRD001__RUN-*.csv'
  workflow_dispatch:
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/report_utg_sixclass_frequency.py
