name: UTG cbet refine report

on:
  push:
    branches: [main]
    paths:
      - 'tools/report_utg_cbet_refine.py'
      - '.github/workflows/utg-cbet-refine.yml'
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print UTG cbet refinement report
        run: python3 tools/report_utg_cbet_refine.py
