name: CFG001 refine report

on:
  push:
    branches: [main]
    paths:
      - 'tools/report_cfg001_refine.py'
      - '.github/workflows/cfg001-refine.yml'
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print CFG001 refinement report
        run: python3 tools/report_cfg001_refine.py
