<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Flop Lab · тренажёр стратегии</title><style>/*__CSS__*/</style></head><body>
<header><div class="brand"><span class="brand-icon">♠</span><div>FLOP LAB</div></div></header>
<main>
<section class="panel branch-panel" aria-label="Ветки тренировки"><div id="branches" class="branch-groups"></div></section>
<div class="workspace"><section class="game panel">
<div class="game-top"><span id="spot">Подготовка тренажёра…</span></div>
<div class="poker-table" id="felt"><div class="seat villain"><div class="avatar">◈</div><strong id="villainPos">Оппонент</strong><span id="villainStack">97,5 bb</span><div class="hole backs"><i></i><i></i></div><span id="villainAction" class="bubble"></span></div><div class="table-center"><div id="pot" class="pot">Банк 5,5 bb</div><div id="board" class="cards"></div><div id="street">ФЛОП · 100 BB · ½ БАНКА</div></div><div class="seat hero"><span id="heroAction" class="bubble"></span><div id="hole" class="cards"></div><strong id="heroPos">Вы</strong><span id="heroStack">97,5 bb</span></div></div>
<div class="decision-line"><div><span id="decisionLabel">Загрузка встроенных данных</span><small id="handClass"></small></div><div class="rng"><small>Рандомайзер</small><strong id="randomizer">—</strong></div></div>
<div id="actions" class="actions"></div><div id="feedback" role="status" aria-live="polite"></div>
<div class="game-bottom"><button id="continue" hidden>Продолжить раздачу →</button><button id="next" disabled>Следующая раздача →</button></div>
<details class="history"><summary>История раздачи</summary><ol id="history"></ol></details>
</section>
</div>
<section class="panel study"><nav class="tabs" role="tablist"><button role="tab" aria-selected="true" data-tab="decisions">Таблица решений</button><button role="tab" aria-selected="false" data-tab="ranges">Диапазоны и преимущество</button><button role="tab" aria-selected="false" data-tab="explanation">Разборы флопа</button></nav><div id="decisions" role="tabpanel" class="tabcontent"></div><div id="ranges" role="tabpanel" class="tabcontent" hidden></div><div id="explanation" role="tabpanel" class="tabcontent prose" hidden></div></section>
</main><script id="trainer-data" type="application/json">"__PAYLOAD__"</script><script>/*__CORE__*/</script><script>/*__APP__*/</script></body></html>
